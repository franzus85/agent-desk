name: Eval (nightly, full suite)

on:
  schedule:
    # 03:00 UTC daily
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  eval-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check for Anthropic credentials
        id: check-key
        run: echo "has_key=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      # Full suite (quick + full tier) — this is the run of record: it
      # writes evals/reports/latest.{json,html}, the baseline the PR gate
      # diffs cost against. No pass/cost threshold here — a nightly failure
      # here is signal to look at, not something that should block anything.
      - name: Run the full eval sweep
        if: steps.check-key.outputs.has_key == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm eval
      # Uploaded rather than committed back to main — an unreviewed bot
      # commit landing on main every night is a bigger decision than "wire
      # up the nightly sweep"; report the report, don't auto-merge it.
      - name: Upload report
        if: steps.check-key.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/latest.*
          retention-days: 30
