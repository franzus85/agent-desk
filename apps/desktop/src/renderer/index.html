<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>AgentDesk</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        background: #14181d;
        color: #e7e9ec;
        display: flex;
      }
      #root, .app { display: flex; flex-direction: column; width: 100%; height: 100vh; }
      .conversation { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
      .empty-hint { color: #8b93a1; font-size: 14px; }
      .msg-text p { margin: 0 0 8px; line-height: 1.5; max-width: 62ch; white-space: pre-wrap; }
      .msg-text p:last-child { margin-bottom: 0; }
      pre.code {
        background: #1c2128; border: 1px solid #2c333c; border-radius: 6px;
        padding: 10px 12px; overflow-x: auto; font-size: 13px; margin: 0 0 8px;
      }
      pre.code-open { border-color: #4a5568; border-style: dashed; }
      .tool-card {
        border: 1px solid #2c333c; border-radius: 8px; padding: 8px 12px;
        background: #1a1f26; font-size: 13px; max-width: 62ch;
      }
      .tool-head { display: flex; justify-content: space-between; align-items: center; font-family: ui-monospace, monospace; }
      .tool-name { font-weight: 600; }
      .tool-status { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 7px; border-radius: 100px; }
      .tool-running .tool-status { background: #3a4657; color: #9fc4ff; }
      .tool-done .tool-status { background: #1f3d31; color: #6fd6a3; }
      .tool-failed .tool-status { background: #402323; color: #ff9b8a; }
      .tool-card details { margin-top: 6px; }
      .tool-card summary { cursor: pointer; color: #8b93a1; font-size: 12px; }
      .tool-card pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; }
      .tool-error { color: #ff9b8a; margin-top: 6px; }
      .run-error { color: #ff9b8a; font-size: 13px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .composer { display: flex; gap: 8px; padding: 14px 24px; border-top: 1px solid #2c333c; }
      .composer input {
        flex: 1; background: #1a1f26; border: 1px solid #2c333c; border-radius: 8px;
        color: inherit; padding: 10px 12px; font-size: 14px;
      }
      .composer input:focus-visible, .composer button:focus-visible {
        outline: 2px solid #6fa8ff; outline-offset: 1px;
      }
      .composer button {
        background: #2f6fed; color: white; border: none; border-radius: 8px;
        padding: 0 18px; font-size: 14px; cursor: pointer;
      }
      .composer button:disabled { opacity: 0.5; cursor: default; }
      #cancel-run { background: #7a3232; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./index.js"></script>
  </body>
</html>
